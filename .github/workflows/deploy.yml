name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: EC2_APP_DIR
          script: |
            set -e
            cd "$EC2_APP_DIR"
            git pull --ff-only origin main
            cd backend
            npm ci --omit=dev
            if pm2 describe enterprise-api >/dev/null 2>&1; then
              pm2 restart enterprise-api --update-env
            else
              pm2 start server.js --name enterprise-api
            fi
            pm2 save
            for attempt in $(seq 1 10); do
              if curl --fail --silent http://127.0.0.1:5000/health; then
                exit 0
              fi
              sleep 3
            done
            echo "Health check failed after deployment" >&2
            exit 1